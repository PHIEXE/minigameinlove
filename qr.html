
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>สแกน IG เลยย</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  font-family: "Kanit", sans-serif;
  background: linear-gradient(135deg,#ffd6ec,#fff5fa);
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 350px;
  background: white;
  border-radius: 25px;
  padding: 30px 20px;
  box-shadow: 0 8px 25px #ff9acb55;
}

h1 {
  color: #ff4da6;
}

p {
  color: #b56b91;
  line-height: 1.8;
}

img {
  width: 220px;
  max-width: 80%;
  border-radius: 15px;
  margin: 15px 0;
}

button {
  font-family: inherit;
  background: #ff66b2;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 12px 25px;
  font-size: 17px;
}
</style>
</head>

<body>

<div class="card">
  <h1> เก่งมากเลยย!</h1>

  <p>
    ขอบคุณที่เล่นเกมของเรานะะะ<br>
    ถ้าอยากคุยกันต่อก็สแกนเลยย555
  </p>

  <img
    src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Finstagram.com%2Fp.hiraphat_hi"
    alt="Instagram QR Code"
  >

  <p>📱 สแกน QR Code เพื่อไป Instagram</p>

  <button onclick="goIG()">เปิด Instagram 💗</button>
</div>

<script>
function goIG() {
  window.location.href = "https://instagram.com/p.hiraphat_hi";
}
</script>

</body>
</html>
