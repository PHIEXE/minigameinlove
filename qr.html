<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>สแกน IG เลยย</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  font-family: "Kanit", sans-serif;
  padding: 20px;
  color: #d94b91;
  background:
    radial-gradient(circle at 15% 10%, #fff0f8 0%, transparent 40%),
    radial-gradient(circle at 85% 90%, #ffe6f2 0%, transparent 45%),
    linear-gradient(135deg, #ffd6ec, #ffeef7, #fff5fa);
  background-attachment: fixed;
}

.card {
  width: 100%;
  max-width: 360px;
  background: #fff;
  border-radius: 28px;
  padding: 30px 22px 26px;
  border: 2px solid #ffd6ec;
  box-shadow:
    0 14px 40px #e98ab555,
    0 2px 8px #e98ab533,
    inset 0 0 0 1px #ffeaf4;
  animation: appear .5s cubic-bezier(.2, .9, .3, 1.35);
}

h1 {
  margin: 0 0 10px;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: .3px;
  background: linear-gradient(90deg, #ff4da6, #ff85c1 50%, #ff4da6);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 2px 3px #ffb6d988);
}

p {
  color: #a65b83;
  line-height: 1.85;
  font-size: 15px;
  font-weight: 400;
  margin: 6px 0;
}

img {
  width: 220px;
  max-width: 80%;
  margin: 16px 0;
  padding: 10px;
  border-radius: 20px;
  background: #fff;
  border: 2px solid #ffd6ec;
  box-shadow:
    0 8px 22px #ffb6d955,
    inset 0 0 0 6px #fff5fb;
  transition: transform .25s ease;
}

img:hover {
  transform: scale(1.03) rotate(-1deg);
}

button {
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: .3px;
  margin-top: 8px;
  padding: 13px 26px;
  color: #fff;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #ff85c1, #ff4da6);
  cursor: pointer;
  box-shadow: 0 6px 16px #ff66b255, 0 2px 4px #ff4da633;
  transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
  touch-action: manipulation;
}

button:hover {
  filter: brightness(1.06);
  box-shadow: 0 9px 22px #ff66b277, 0 2px 4px #ff4da633;
}

button:active {
  transform: scale(.95);
  box-shadow: 0 3px 10px #ff66b255;
}

@keyframes appear {
  from { transform: scale(.9); opacity: 0; }
  to   { transform: scale(1);  opacity: 1; }
}

@media (max-width: 400px) {
  h1 { font-size: 23px; }
  .card { padding: 26px 18px 22px; }
}
</style>
</head>

<body>

<div class="card">
  <h1> เก่งมากเลยย!</h1>

  <p>
    ขอบคุณที่เล่นเกมของเรานะะะ<br>
    ถ้าอยากคุยกันต่อก็สแกนเลยย555
  </p>

  <img
    src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Finstagram.com%2Fp.hiraphat_hi"
    alt="Instagram QR Code"
  >

  <p>📱 สแกน QR Code เพื่อไป Instagram</p>

  <button onclick="goIG()">เปิด Instagram 💗</button>
</div>

<script>
function goIG() {
  window.location.href = "https://instagram.com/p.hiraphat_hi";
}
</script>

</body>
</html>
